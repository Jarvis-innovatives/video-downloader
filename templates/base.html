{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SnapGrab — Video & MP3 Downloader{% endblock %}</title>
  <meta name="description" content="Paste a YouTube, Instagram, or TikTok link and download it as video or MP3 in the quality you choose.">
  <meta property="og:title" content="SnapGrab — Video & MP3 Downloader">
  <meta property="og:description" content="Paste a YouTube, Instagram, or TikTok link and download it as video or MP3 in the quality you choose.">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" href="{% static 'media/favicon.ico' %}" type="image/x-icon">
  <link rel="preconnect" href="https://api.fontshare.com" crossorigin="anonymous">
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=clash-display@500,600,700&f[]=satoshi@400,500,700&display=swap">
  <link rel="stylesheet" href="{% static 'css/styles.css' %}">
  {% block extra_head %}{% endblock %}
</head>
<body>
  {% block content %}{% endblock %}

  <script src="{% static 'js/app.js' %}"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
